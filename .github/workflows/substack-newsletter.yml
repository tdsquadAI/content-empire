name: Substack Newsletter

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 14:00 UTC
    - cron: "0 14 * * 5"

permissions:
  contents: read

jobs:
  create-newsletter-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate newsletter article links
        run: python -m unittest discover -s tests -p test_substack_newsletter.py

      - name: Create Substack newsletter draft
        env:
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
          SUBSTACK_PUBLICATION_URL: ${{ secrets.SUBSTACK_PUBLICATION_URL }}
        run: python scripts/substack-newsletter.py

      - name: Upload newsletter draft as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newsletter-draft
          path: newsletter-draft.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Report newsletter draft
        if: always()
        run: |
          if [ -f newsletter-draft.html ]; then
            TITLE=$(head -1 newsletter-draft.html | sed 's/<!-- Title: //' | sed 's/ -->//')
            echo "Newsletter draft ready: $TITLE"
            echo "Review the 'newsletter-draft' artifact when the upload step succeeds."
            {
              echo "## Newsletter draft / טיוטת ניוזלטר"
              echo "A draft was generated; this workflow does not send the newsletter."
              echo "נוצרה טיוטה; תהליך זה אינו שולח את הניוזלטר."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
